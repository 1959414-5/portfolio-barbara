name: Test Java Spring Boot project

on:
  push:
    branches: ["main"]
    paths:
      - "projects/ads/**"
      - ".github/workflows/java-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ads
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: projects/ads/pom.xml
      - name: Verify Maven project
        run: mvn --batch-mode --no-transfer-progress test
